name: Verification Gatekeeper

on:
  pull_request:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      sprints: ${{ steps.filter.outputs.sprints }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identify changed and dependent sprint directories
        id: filter
        run: |
          changed=$(git diff --name-only origin/${{ github.base_ref }} HEAD | grep '^sprint' | cut -d/ -f1 | sort -u)
          
          all_sprints=""
          
          for sprint in $changed
          do
            all_sprints="${all_sprints} ${sprint}"
            
            for potential_dependent in sprint*/
            do
              dependent_name=${potential_dependent%/}
              
              if grep -q -R -l "$sprint" "$dependent_name"
              then
                all_sprints="${all_sprints} ${dependent_name}"
              fi
            done
          done
          
          final_sprints=$(echo "$all_sprints" | tr ' ' '\n' | sort -u | xargs)
          
          echo "sprints=${final_sprints}" >> "$GITHUB_OUTPUT"

  open-source-verification:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.sprints != '' }}
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Open-Source SV and Cocotb Simulations
        uses: devcontainers/ci@v0.3
        env:
          CHANGED_SPRINTS: ${{ needs.detect-changes.outputs.sprints }}
        with:
          runCmd: |
            for sprint in $CHANGED_SPRINTS
            do
              if [ -d "${sprint}/tests/cocotb" ]
              then
                make -C "${sprint}/tests/cocotb"
              fi
            done

  repo-artifact-validation:
    runs-on: ubuntu-latest
    # Removed open-source-verification from needs to allow parallel execution
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.sprints != '' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Quartus and Questa artefacts for changed sprints
        env:
          CHANGED_SPRINTS: ${{ needs.detect-changes.outputs.sprints }}
        run: |
          shopt -s nullglob
          
          for sprint in $CHANGED_SPRINTS
          do
            if [ -d "${sprint}/tests/sv" ]
            then
              summary="${sprint}/tests/sv/questa_test_summary.log"
              
              if [ ! -f "$summary" ]
              then
                echo "Error: Local Questa summary missing (${summary})."
                exit 1
              fi
              
              if ! grep -q "ERRORS=0" "$summary"
              then
                echo "Error: Questa summary does not show ERRORS=0 in ${sprint}."
                exit 1
              fi
              
              if ! grep -q "WARNINGS=0" "$summary"
              then
                echo "Error: Questa summary does not show WARNINGS=0 in ${sprint}."
                exit 1
              fi
              
              if ! grep -q "ALL_TESTS_PASSED" "$summary"
              then
                echo "Error: Questa summary does not show ALL_TESTS_PASSED in ${sprint}."
                exit 1
              fi
              
              echo "Questa summary verified for ${sprint}."
            fi

            reports=("${sprint}/output_files"/*_flow.rpt)
            
            if [ ${#reports[@]} -eq 0 ]
            then
              echo "Error: Local synthesis artefact missing in ${sprint}/output_files"
              exit 1
            fi
            
            for report in "${reports[@]}"
            do
              if grep -q "Successful" "$report"
              then
                echo "Local synthesis verified for ${report}."
              else
                echo "Error: Local synthesis was not successful in ${report}."
                exit 1
              fi
            done
          done